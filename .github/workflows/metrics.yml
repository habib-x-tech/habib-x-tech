name: GitHub Metrics

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: habib-x-tech
          template: classic
          base: header, activity, repositories
          config_timezone: Asia/Kolkata
          plugin_languages: yes
          plugin_isocalendar: yes
